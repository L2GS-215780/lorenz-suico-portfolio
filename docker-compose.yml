services:
  backend:
    build: ./backend
    image: portfolio-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npx nodemon -L index.js
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: deps
    image: portfolio-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped